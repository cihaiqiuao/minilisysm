name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check formatting
        run: bash scripts/format_check.sh

  lint:
    name: Clang-Tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang-tidy git curl zip unzip tar
      - name: Configure compile database
        run: bash scripts/build.sh
      - name: Run clang-tidy
        run: bash scripts/lint.sh

  build-test:
    name: Build and Test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang git curl zip unzip tar
      - name: Verify with GCC
        if: matrix.compiler == 'gcc'
        run: bash scripts/verify.sh
      - name: Verify with Clang
        if: matrix.compiler == 'clang'
        env:
          CC: clang
          CXX: clang++
        run: bash scripts/verify.sh

  asan-ubsan:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git curl zip unzip tar
      - name: Verify sanitizer build
        run: bash scripts/verify.sh --asan

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config lcov git curl zip unzip tar
      - name: Generate coverage report
        run: bash scripts/coverage.sh
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: minilisysm-coverage-report
          path: build/coverage-report
