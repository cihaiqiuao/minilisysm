[linux_stability_monitor]
enable=true
config_version=20260613_02
platform=ccu_m100
software_version=0.1.0
device_id=ccu_m100_001
fast_collect_interval_ms=1000
low_freq_collect_interval_ms=10000

[runtime]
dispatcher_idle_sleep_ms=2
sink_idle_sleep_ms=5

[metrics]
enable=true
bind_host=0.0.0.0
port=9108
scrape_runtime=true
scrape_collectors=true
scrape_rule_state=true
allowed_clients=

[agent_log]
enable=true
level=info
console=true
path=./logs/agent/minilisysm-agent.log
rotation=size
rotate_mb=16
rotate_files=8
async_queue_size=8192

[thread_policy]
fast_collector_cpu=-1
sched_collector_cpu=-1
persist_thread_cpu=-1
fast_collector_nice=5
sched_collector_nice=8
background_nice=10

[event_queue]
capacity=4096
critical_reserved_slots=32
drop_info_when_full=true
drop_warning_when_full=true

[memory_rule]
enable=true
mem_available_warning_mb=512
mem_available_critical_mb=256
mem_available_recovery_mb=768
continuous_warning_windows=3
continuous_critical_windows=2
recovery_windows=3
cooldown_sec=60

[rule_runtime]
cooldown_sec=60
state_ttl_sec=3600

[self_protection]
enable=true
queue_warning_percent=70
queue_critical_percent=90
queue_recovery_percent=50
self_recovery_windows=3
self_rss_soft_limit_mb=40
self_rss_hard_limit_mb=64
self_rss_recovery_mb=32

[sched_delay_rule]
enable=true
source=proc
process_whitelist=
thread_whitelist=
wait_sum_warning_us=10000
wait_sum_critical_us=30000
wait_sum_recovery_us=5000
ebpf_min_wait_us=10000
ebpf_ringbuf_kb=1024
ebpf_max_events_per_poll=4096
ebpf_lifecycle_enable=true
ebpf_allowlist_refresh_ms=10000
ebpf_aggregate_enable=false
ebpf_aggregate_window_ms=1000
ebpf_aggregate_max_entries=8192
proc_cache_refresh_ms=10000
proc_max_scan_threads=4096
collector_overrun_warning_ms=200
involuntary_switch_warning=100
continuous_warning_windows=3
continuous_critical_windows=2
recovery_windows=3
max_targets=32

[process_memory_rule]
enable=true
growth_warning_mb=100
growth_critical_mb=200
growth_recovery_mb=20
growth_window_sec=600

[io_delay_rule]
enable=true
device_whitelist=
await_warning_ms=50
await_critical_ms=200
await_recovery_ms=20
util_warning_percent=80
util_critical_percent=95
util_recovery_percent=50
continuous_warning_windows=3
continuous_critical_windows=2
recovery_windows=3
max_targets=16

[cpu_usage_rule]
enable=true
mode=total
core_whitelist=
warning_percent=80
critical_percent=95
recovery_percent=60
continuous_warning_windows=3
continuous_critical_windows=2
recovery_windows=3

[persistence]
enable=true
cache_path=./logs/events
cache_max_mb=100
file_rotate_mb=4
critical_fsync=true
max_fsync_per_minute=6
summary_enable=true
summary_color=false

[network_sink]
enable=false
endpoint=http://127.0.0.1:8080/events
batch_size=128
flush_interval_ms=1000
connect_timeout_ms=500
request_timeout_ms=2000
retry_base_ms=1000
retry_max_ms=60000
wal_path=./logs/wal
wal_max_mb=64
wal_segment_mb=4
